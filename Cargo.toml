[package]
name = "blend-receiver"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Receiver for Blend emitter handover"

[workspace]
members = ["test-suites"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "25.3.0"
stellar-access = "=0.7.0"
stellar-macros = "=0.7.0"
stellar-tokens = "=0.7.0"
# Keep the token library's transitive OZ dependencies on the same SDK release.
stellar-contract-utils = "=0.7.0"
stellar-governance = "=0.7.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
